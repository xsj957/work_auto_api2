[pytest]
# 测试目录
testpaths = testcase

# Python 文件匹配模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 输出选项
addopts =
    -v
    -s
    --tb=short
    --strict-markers

# 自定义 markers
markers =
    smoke: 冒烟测试（快速验证核心功能）
    regression: 回归测试（验证功能未退化）
    performance: 性能测试（验证性能指标）
    concurrent: 并发测试（验证并发场景）
    lighting: 灯控测试（验证灯控功能）
    payment: 支付测试（验证支付流程）

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Allure 报告（如果使用）
# addopts = --alluredir=reports/allure-results

# 超时设置（需要 pytest-timeout）
# timeout = 300

# 并行测试（需要 pytest-xdist）
# addopts = -n auto
