# ================================================================
# 环境配置（按 env 字段自动合并到顶层）
# 切换 env 后，host / app_host / ssl_verify / business_data / payment_test 会自动跟随
# ================================================================
environments: 
  # ----------------------------------------------------------------
  # UAT 测试环境
  # ----------------------------------------------------------------
  UAT:
    host: https://uat.supervisionsstore.com
    app_host: https://uat.supervisionsstore.com
    ssl_verify: false

    business_data:
      login:
        username: "13538506002"
        password: "506002"
      xcx_token: "43e39e7ac6274e6dabd26fa20300aa68"   # 小程序Token，7天有效
      storeNo: "692256"
      merchantNo: "MI000026081317423923"
      userNo: "MU202606171016150897"
      device_id: 322
      golferPhones:
        - "13538506002"
        - "19928710361"
      lsid: "SD202606171505254807"
      success_code: 200

    payment_test:
      # 并发测试配置（asyncio + aiohttp 实现）
      concurrency:
        submit_workers: 2        # test_02 双重提交并发数
        stress_workers: 10000     # test_07 压力测试并发数

      # 轮询查询配置（系统调度接口新增资源后需要等待同步）
      # 稳定性测试连续执行时服务端同步较慢，需要更长等待
      polling:
        initial_wait: 8        # 首次等待时间（秒），给系统调度预留缓冲
        interval: 3            # 轮询间隔（秒）
        max_attempts: 8        # 最大轮询次数
        timeout: 35            # 总超时时间（秒），超过则放弃

      region:
        base_name: "测试区"
        sort: 1
        status: 1
        type: "1"

      fee:
        base_name: "测试费"
        price: 20
        time: 60
        max_pause_time: 10
        min_pause_interval: 1
        min_time: 1
        can_pause: 1
        low_consume_type: 0
        unit_time: 1
        over_unit_time: 0

      desk:
        base_name: "测试桌台"
        type: "1"
        status: 2
        user_discount: 2
        can_clock: 1
        clock_cashier: 1
        clock_mini_program: 1
        is_sync_setting: "1"
        is_close: 0
        is_account: 0
        is_order: 0
        is_stand: 0
        is_reserve: 0
        active_key: 1
        can_balance: 1

      # 支付方式 (channelCode, 显示名称, 会员手机号/None)
      # czk(储值卡)、tfk(台费卡) 需绑定会员
      channels:
